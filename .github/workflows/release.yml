name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check version
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is package.json version already tagged?
        id: v
        run: |
          V=v$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "release=false" >> $GITHUB_OUTPUT
            echo "::notice::$V already released — skipping"
          else
            echo "release=true" >> $GITHUB_OUTPUT
            echo "::notice::releasing $V"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build_args: --mac --arm64 --x64
            artifact: morph-mac
          - os: windows-latest
            platform: win
            build_args: --win --x64
            artifact: morph-win-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.artifact }})

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install
        env:
          npm_config_optional: true

      - name: Build renderer
        run: npm run build

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      - name: Disable macOS code signing
        if: matrix.platform == 'mac'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV

      - name: Build Electron app
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
