name: Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

# Queue pushes to main so two releases can't race on the same tag.
# Superseded PR pushes just get cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs and branches: fast compile/typecheck only. No installers, no tag.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run build

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Next version
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conventional-commit bump off the last tag. Tags are the source of
      # truth for the version; package.json in git is only a dev placeholder.
      - id: v
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)
          LOG=$(git log ${LAST:+$LAST..}HEAD --no-merges --format='%s%n%b')
          if echo "$LOG" | grep -qE '^(BREAKING CHANGE:|[a-z]+(\(.+\))?!:)'; then
            BUMP=major
          elif echo "$LOG" | grep -qE '^feat(\(.+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          BASE=${LAST#v}
          IFS=. read -r MA MI PA <<< "${BASE:-0.0.0}"
          case $BUMP in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          echo "version=v$MA.$MI.$PA" >> $GITHUB_OUTPUT
          echo "::notice::${LAST:-no tags} -> v$MA.$MI.$PA ($BUMP)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build_args: --mac --arm64 --x64
            artifact: morph-mac
          - os: windows-latest
            platform: win
            build_args: --win --x64
            artifact: morph-win-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.artifact }})

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Stamps the computed version into the build (electron-builder + the
      # __APP_VERSION__ vite define). Never committed back to the repo.
      - name: Stamp version
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install
        env:
          npm_config_optional: true

      - name: Build renderer
        run: npm run build

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      - name: Disable macOS code signing
        if: matrix.platform == 'mac'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV

      - name: Build Electron app
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
